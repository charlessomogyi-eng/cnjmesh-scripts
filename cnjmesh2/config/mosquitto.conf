# Mosquitto configuration for Meshtastic
# LIVE COPY of ~/meshtastic-mqtt/mosquitto/config/mosquitto.conf on cnjmesh2,
# synced from the Pi on Oct 25 2026. (meshdev/large4cats is the public
# Meshtastic broker login.)

# Listen on all interfaces, port 1883
listener 1883
allow_anonymous true

# Persistence
persistence true
persistence_location /mosquitto/data/

# Logging
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
log_type subscribe
log_type unsubscribe
log_type websockets
log_type debug

# Connection messages
connection_messages true
log_timestamp true

# Bridge to public MQTT
connection meshtastic_centnj
address mqtt.meshtastic.org:1883
remote_username meshdev
remote_password large4cats
clientid cnjmesh2-bridge
topic # out 0 filtered/msh/US/ msh/US/NJ/
topic msh/US/NJ/2/e/CentNJ-MQTT/# in 0
topic msh/US/2/e/CentNJ-MQTT/# in 0
topic msh/US/2/e/CentralNJ/# in 0
topic msh/US/NJ/2/e/CentralNJ/# in 0
#topic msh/US/NJ/2/e/CentNJ-MQTT/# in 0 msh/US/NJ/ inbound/msh/US/NJ/
#topic msh/US/NJ/2/e/CentNJ-MQTT/# in 0 msh/US/NJ/ msh/US/
cleansession true
try_private true
notifications false
bridge_protocol_version mqttv311
#no_local true
topic msh/US/2/e/CentralNJ/# out 0
