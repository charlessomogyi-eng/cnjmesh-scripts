allow_anonymous false
listener 1883
listener 9001
 protocol websockets
persistence false
password_file /mosquitto/config/pwfile
log_type all

# ---------------------------------------------------------------------------
# LIVE COPY of /opt/stacks/mqtt/config/mosquitto.conf on cnjmesh1,
# synced from the Pi on Oct 25 2026 (file mtime on the Pi: Aug 15 21:48).
# Two passwords are redacted on purpose (see docs/mqtt-topology-and-landmines.md):
# oceancounty and meshomatic. The others are shared/public community logins.
# DO NOT un-comment the SJMesh block below while sjmesh-relay.service runs:
# it re-creates the Aug 5 republish loop.
# ---------------------------------------------------------------------------

# Bridge to public Meshtastic broker
connection meshtastic_public
address mqtt.meshtastic.org:1883
remote_username meshdev
remote_password large4cats
clientid cnjmesh1-CJG2-bridge
topic msh/US/2/e/CentralNJ/# out 0
topic msh/US/2/json/CentralNJ/# out 0
cleansession true
try_private false
notifications false
bridge_attempt_unsubscribe false
bridge_protocol_version mqttv311
restart_timeout 10


# Bridge from Ocean County Mesh (inbound only)
connection oceancounty
address mqtt.oceancountyme.sh:8883
remote_username oceanmesh
remote_password REDACTED
clientid cnjmesh1-oceancounty-bridge
topic msh/US/2/e/CentralNJ/# in 0
topic msh/US/NJ/2/e/CentralNJ/# in 0
bridge_insecure true
cleansession true
try_private false
notifications false
bridge_attempt_unsubscribe false
bridge_protocol_version mqttv311
restart_timeout 10

# Bridge from Liam Cottle's broker (inbound only)
connection liamcottle
address mqtt.meshtastic.liamcottle.net:1883
remote_username uplink
remote_password uplink
clientid cnjmesh1-liamcottle-bridge
topic msh/US/2/e/CentralNJ/# in 0
topic msh/US/NJ/2/e/CentralNJ/# in 0
topic msh/US/2/e/LongFast/# in 0
topic msh/US/NJ/2/e/LongFast/# in 0
cleansession true
try_private false
notifications false
bridge_attempt_unsubscribe false
bridge_protocol_version mqttv311
restart_timeout 10

